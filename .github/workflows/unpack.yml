name: Unpack project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf unpacked
          mkdir unpacked
          unzip -q Tasare7_production_ready.zip -d unpacked

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "unpacked" \
            -exec rm -rf {} +

          cp -a unpacked/repo2/. .

          rm -rf unpacked
          rm -f Tasare7_production_ready.zip

      - name: Commit project structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore production project structure"
          git push
